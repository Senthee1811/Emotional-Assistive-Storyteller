<!DOCTYPE html>
<html>
<head>
    <title>WebSocket Connection Test</title>
    <style>
        :root {
            --line: rgba(15, 23, 42, 0.12);
        }
        body {
            font-family: "Nunito", Arial, sans-serif;
            margin: 0;
            padding: 20px;
            color: #0f172a;
            background:
                radial-gradient(circle at 10% 20%, rgba(79, 139, 255, 0.18), transparent 32%),
                radial-gradient(circle at 90% 10%, rgba(255, 95, 162, 0.22), transparent 30%),
                radial-gradient(circle at 50% 90%, rgba(255, 209, 102, 0.20), transparent 38%),
                linear-gradient(180deg, #f9fbff 0%, #f3f6ff 50%, #f5f7ff 100%);
        }
        .suite-shell {
            max-width: 860px;
            margin: 0 auto 14px;
        }
        .suite-shell-inner {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            flex-wrap: wrap;
            border-radius: 14px;
            background: rgba(255,255,255,0.86);
            border: 1px solid var(--line);
            padding: 10px 12px;
            box-shadow: 0 10px 24px rgba(15,23,42,0.08);
        }
        .suite-brand { font-weight: 800; color: #0f3d58; }
        .suite-links { display: flex; gap: 8px; flex-wrap: wrap; }
        .suite-links a { color:#0f3d58; text-decoration:none; font-weight:700; background:#fff; border:1px solid var(--line); border-radius:10px; padding:7px 10px; }
        .suite-links a.active { color:#fff; border-color: transparent; background: linear-gradient(135deg, #5aa7ff, #4b87ff); }
        .status { padding: 10px; margin: 10px 0; border-radius: 5px; }
        .online { background-color: #d4edda; color: #155724; }
        .offline { background-color: #f8d7da; color: #721c24; }
        .log { background-color: #f8f9fa; padding: 10px; margin: 10px 0; border: 1px solid #dee2e6; border-radius: 10px; max-height: 260px; overflow-y:auto; }
        button { padding: 10px 20px; margin: 5px; border:none; border-radius:10px; background: linear-gradient(135deg, #5aa7ff, #4b87ff); color:#fff; font-weight:700; cursor:pointer; }
        .panel { max-width: 860px; margin: 0 auto; background: #fff; border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 12px 28px rgba(15,23,42,0.12); padding: 20px; }
    </style>
</head>
<body>
    <div class="suite-shell">
        <div class="suite-shell-inner">
            <div class="suite-brand">Care Fusion Suite</div>
            <nav class="suite-links">
                <a href="http://localhost:8080/index.html">Story</a>
                <a href="http://localhost:5001/sign">Sign</a>
                <a class="active" href="http://localhost:8100/dashboard.html">Stutter</a>
            </nav>
        </div>
    </div>
    <div class="panel">
    <h1>WebSocket Connection Test</h1>
    
    <div id="wsStatus" class="status offline">WebSocket: Disconnected</div>
    
    <button onclick="connectWebSocket()">Connect WebSocket</button>
    <button onclick="disconnectWebSocket()">Disconnect</button>
    <button onclick="sendTestMessage()">Send Test Message</button>
    
    <div class="log">
        <h3>Connection Log:</h3>
        <div id="logContent"></div>
    </div>
    </div>

    <script>
        let websocket = null;
        const WS_URL = 'ws://localhost:8001/ws';
        
        function log(message) {
            const logContent = document.getElementById('logContent');
            const timestamp = new Date().toLocaleTimeString();
            logContent.innerHTML += `<div>[${timestamp}] ${message}</div>`;
            logContent.scrollTop = logContent.scrollHeight;
        }
        
        function updateStatus(isOnline) {
            const statusElement = document.getElementById('wsStatus');
            if (isOnline) {
                statusElement.className = 'status online';
                statusElement.textContent = 'WebSocket: Connected';
            } else {
                statusElement.className = 'status offline';
                statusElement.textContent = 'WebSocket: Disconnected';
            }
        }
        
        function connectWebSocket() {
            if (websocket && websocket.readyState === WebSocket.OPEN) {
                log('WebSocket already connected');
                return;
            }
            
            log('Attempting to connect to WebSocket...');
            
            try {
                websocket = new WebSocket(WS_URL);
                
                websocket.onopen = () => {
                    log('WebSocket connected successfully');
                    updateStatus(true);
                };
                
                websocket.onclose = (event) => {
                    log(`WebSocket disconnected: ${event.code} - ${event.reason}`);
                    updateStatus(false);
                };
                
                websocket.onerror = (error) => {
                    log(`WebSocket error: ${error}`);
                    updateStatus(false);
                };
                
                websocket.onmessage = (event) => {
                    log(`Message received: ${event.data}`);
                };
                
            } catch (error) {
                log(`Connection failed: ${error.message}`);
                updateStatus(false);
            }
        }
        
        function disconnectWebSocket() {
            if (websocket) {
                websocket.close();
                websocket = null;
                log('WebSocket disconnected manually');
                updateStatus(false);
            }
        }
        
        function sendTestMessage() {
            if (websocket && websocket.readyState === WebSocket.OPEN) {
                const message = JSON.stringify({
                    type: 'test',
                    data: 'Hello from test client'
                });
                websocket.send(message);
                log(`Sent: ${message}`);
            } else {
                log('WebSocket not connected');
            }
        }
        
        // Auto-connect on page load
        window.onload = () => {
            setTimeout(connectWebSocket, 1000);
        };
    </script>
</body>
</html>
