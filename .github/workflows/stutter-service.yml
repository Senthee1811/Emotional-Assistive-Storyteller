name: Stutter Service CI

on:
  push:
    paths:
      - 'services/stutter-service/**'
      - '.github/workflows/stutter-service.yml'
  pull_request:
    paths:
      - 'services/stutter-service/**'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: cd services/stutter-service && pip install -r requirements.txt
      - name: Build Docker Image
        run: docker build -t stutter-service:latest ./services/stutter-service
