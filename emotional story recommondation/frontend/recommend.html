<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StoryPal | All Stories</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f0f9ff;
      --panel: #ffffff;
      --muted: #64748b;
      --text: #1e293b;
      --accent: #3b82f6;
      --accent-2: #ec4899;
      --radius: 20px;
      --shadow: 0 8px 32px rgba(31, 38, 135, 0.15);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 20px;
      font-family: 'Fredoka', 'Manrope', 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
    }
    .header {
      background: rgba(255,255,255,0.95);
      border-radius: var(--radius);
      padding: 20px;
      margin-bottom: 30px;
      box-shadow: var(--shadow);
      text-align: center;
      backdrop-filter: blur(10px);
    }
    .title {
      font-size: 2.5rem;
      font-weight: 700;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      margin: 0 0 10px 0;
    }
    .subtitle {
      font-size: 1.2rem;
      color: var(--muted);
      margin: 0;
    }
    .nav-links {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 15px;
    }
    .nav-links a {
      background: linear-gradient(135deg, #fbbf24, #f59e0b);
      color: white;
      text-decoration: none;
      padding: 10px 20px;
      border-radius: 25px;
      font-weight: 600;
      transition: transform 0.2s, box-shadow 0.2s;
      box-shadow: 0 4px 15px rgba(251, 191, 36, 0.3);
    }
    .nav-links a:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(251, 191, 36, 0.4);
    }
    .stories-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
      gap: 25px;
      margin-bottom: 30px;
    }
    .story-card {
      background: rgba(255,255,255,0.95);
      border-radius: var(--radius);
      padding: 25px;
      box-shadow: var(--shadow);
      transition: transform 0.3s, box-shadow 0.3s;
      backdrop-filter: blur(10px);
      border: 2px solid transparent;
      background-clip: padding-box;
      position: relative;
      overflow: hidden;
    }
    .story-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
    }
    .story-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 12px 40px rgba(31, 38, 135, 0.25);
    }
    .story-emotion {
      display: inline-block;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 0.9rem;
      font-weight: 600;
      margin-bottom: 15px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .emotion-happy { background: linear-gradient(135deg, #fbbf24, #f59e0b); color: white; }
    .emotion-sad { background: linear-gradient(135deg, #60a5fa, #3b82f6); color: white; }
    .emotion-angry { background: linear-gradient(135deg, #f87171, #ef4444); color: white; }
    .emotion-fear { background: linear-gradient(135deg, #a78bfa, #8b5cf6); color: white; }
    .emotion-fearful { background: linear-gradient(135deg, #a78bfa, #8b5cf6); color: white; }
    .emotion-surprise { background: linear-gradient(135deg, #fbbf24, #f59e0b); color: white; }
    .emotion-disgust { background: linear-gradient(135deg, #84cc16, #65a30d); color: white; }
    .emotion-love { background: linear-gradient(135deg, #f472b6, #ec4899); color: white; }
    .emotion-neutral { background: linear-gradient(135deg, #94a3b8, #64748b); color: white; }
    .story-title {
      font-size: 1.3rem;
      font-weight: 700;
      margin: 0 0 15px 0;
      color: var(--text);
    }
    .story-preview {
      color: var(--muted);
      line-height: 1.6;
      margin-bottom: 15px;
      max-height: 120px;
      overflow: hidden;
      position: relative;
    }
    .story-preview::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 30px;
      background: linear-gradient(transparent, rgba(255,255,255,0.9));
    }
    .story-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
      color: var(--muted);
    }
    .confidence-badge {
      background: rgba(34, 197, 94, 0.1);
      color: #16a34a;
      padding: 4px 8px;
      border-radius: 12px;
      font-weight: 600;
    }
    .read-more-btn {
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 25px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      margin-top: 15px;
      width: 100%;
    }
    .read-more-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(59, 130, 246, 0.3);
    }
    .loading {
      text-align: center;
      padding: 40px;
      color: white;
      font-size: 1.2rem;
    }
    .error {
      background: rgba(239, 68, 68, 0.1);
      color: #dc2626;
      padding: 20px;
      border-radius: var(--radius);
      text-align: center;
      margin: 20px 0;
    }
    .story-modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.8);
      z-index: 1000;
      overflow-y: auto;
    }
    .modal-content {
      background: white;
      margin: 50px auto;
      padding: 30px;
      border-radius: var(--radius);
      max-width: 800px;
      position: relative;
    }
    .close-modal {
      position: absolute;
      top: 15px;
      right: 20px;
      font-size: 2rem;
      cursor: pointer;
      color: var(--muted);
      background: none;
      border: none;
    }
    .close-modal:hover {
      color: var(--text);
    }
    .modal-story-text {
      line-height: 1.8;
      color: var(--text);
      white-space: pre-wrap;
      max-height: 60vh;
      overflow-y: auto;
      padding: 20px;
      background: #f8fafc;
      border-radius: 10px;
    }
    @media (max-width: 768px) {
      .stories-grid {
        grid-template-columns: 1fr;
      }
      .title {
        font-size: 2rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1 class="title">🌟 All Story Collection 🌟</h1>
      <p class="subtitle">Explore amazing stories for every mood!</p>
      <nav class="nav-links">
        <a href="index.html">📖 Home</a>
        <a href="http://localhost:5001/sign">🤟 Sign Language</a>
        <a href="http://localhost:8100/dashboard.html">🗣️ Stutter Therapy</a>
        <a class="active" href="recommend.html">📚 All Stories</a>
      </nav>
    </div>

    <div id="loadingMessage" class="loading">
      <div>🎨 Loading all your wonderful stories...</div>
    </div>

    <div id="errorMessage" class="error" style="display: none;">
      <div>😅 Oops! Couldn't load stories. Please try again later.</div>
    </div>

    <div id="storiesContainer" class="stories-grid" style="display: none;">
      <!-- Stories will be loaded here -->
    </div>
  </div>

  <div id="storyModal" class="story-modal">
    <div class="modal-content">
      <button class="close-modal" onclick="closeModal()">&times;</button>
      <h2 id="modalTitle"></h2>
      <div id="modalEmotion"></div>
      <div id="modalStoryText" class="modal-story-text"></div>
    </div>
  </div>

  <script>
    const API_BASE = "http://localhost:5005"; // Emotion backend

    let allStories = [];

    function getEmotionEmoji(emotion) {
      const emojis = {
        happy: '😊',
        sad: '😢',
        angry: '😠',
        fear: '😨',
        fearful: '😨',
        surprise: '😲',
        disgust: '🤢',
        love: '❤️',
        neutral: '😐'
      };
      return emojis[emotion?.toLowerCase()] || '📖';
    }

    function getEmotionDisplayName(emotion) {
      const labels = {
        angry: 'Fiction',
        fearful: 'Ghost',
        fear: 'Ghost',
        happy: 'Fun',
        sad: 'Comedy'
      };
      return labels[emotion?.toLowerCase()] || emotion;
    }

    function truncateText(text, maxLength = 150) {
      if (!text || text.length <= maxLength) return text;
      return text.substring(0, maxLength) + '...';
    }

    function createStoryCard(story) {
      const card = document.createElement('div');
      card.className = 'story-card';
      
      const emotionClass = `emotion-${story.emotion.toLowerCase()}`;
      const emoji = getEmotionEmoji(story.emotion);
      const confidence = story.confidence ? Math.round(story.confidence * 100) : 0;
      
      card.innerHTML = `
        <div class="story-emotion ${emotionClass}">
          ${emoji} ${getEmotionDisplayName(story.emotion)}
        </div>
        <h3 class="story-title">${story.filename.replace(/\.[^/.]+$/, "")}</h3>
        <div class="story-preview">${truncateText(story.story_text)}</div>
        <div class="story-meta">
          <span>📄 ${story.type}</span>
          <span class="confidence-badge">✨ ${confidence}% match</span>
        </div>
        <button class="read-more-btn" onclick="openModal('${story.filename}', '${story.emotion}', \`${story.story_text.replace(/`/g, '\\`')}\`)">
          📖 Read Full Story
        </button>
      `;
      
      return card;
    }

    function openModal(filename, emotion, storyText) {
      const modal = document.getElementById('storyModal');
      document.getElementById('modalTitle').textContent = filename.replace(/\.[^/.]+$/, "");
      document.getElementById('modalEmotion').innerHTML = `
        <span class="story-emotion emotion-${emotion.toLowerCase()}">
          ${getEmotionEmoji(emotion)} ${getEmotionDisplayName(emotion)}
        </span>
      `;
      document.getElementById('modalStoryText').textContent = storyText;
      modal.style.display = 'block';
    }

    function closeModal() {
      document.getElementById('storyModal').style.display = 'none';
    }

    async function loadAllStories() {
      try {
        const response = await fetch(`${API_BASE}/api/all-stories`);
        if (!response.ok) {
          throw new Error('Failed to fetch stories');
        }
        
        const data = await response.json();
        allStories = data.stories || [];
        
        if (allStories.length === 0) {
          document.getElementById('errorMessage').innerHTML = '<div>📚 No stories found. Upload some stories to get started!</div>';
          document.getElementById('errorMessage').style.display = 'block';
        } else {
          const container = document.getElementById('storiesContainer');
          container.innerHTML = '';
          
          allStories.forEach(story => {
            container.appendChild(createStoryCard(story));
          });
          
          container.style.display = 'grid';
        }
        
        document.getElementById('loadingMessage').style.display = 'none';
        
      } catch (error) {
        console.error('Error loading stories:', error);
        document.getElementById('loadingMessage').style.display = 'none';
        document.getElementById('errorMessage').style.display = 'block';
      }
    }

    // Close modal when clicking outside
    window.onclick = function(event) {
      const modal = document.getElementById('storyModal');
      if (event.target === modal) {
        closeModal();
      }
    }

    // Load stories when page loads
    document.addEventListener('DOMContentLoaded', loadAllStories);
  </script>
</body>
</html>
