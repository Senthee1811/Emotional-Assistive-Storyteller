<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Emotional Reader | Story Images</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f5f7ff;
      --panel: #ffffff;
      --muted: #4b5563;
      --text: #0f172a;
      --accent: #4f8bff;
      --accent-2: #ff5fa2;
      --radius: 16px;
      --shadow: 0 18px 48px rgba(15, 23, 42, 0.15);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 24px;
      font-family: 'Manrope', 'Segoe UI', system-ui, -apple-system, sans-serif;
      background:
        radial-gradient(circle at 10% 20%, rgba(79, 139, 255, 0.18), transparent 32%),
        radial-gradient(circle at 90% 10%, rgba(255, 95, 162, 0.22), transparent 30%),
        radial-gradient(circle at 50% 90%, rgba(255, 209, 102, 0.20), transparent 38%),
        linear-gradient(180deg, #f9fbff 0%, #f3f6ff 50%, #f5f7ff 100%);
      color: var(--text);
      min-height: 100vh;
    }
    .suite-shell {
      max-width: 1120px;
      margin: 0 auto 14px;
    }
    .suite-shell-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
      border-radius: 14px;
      background: rgba(255,255,255,0.86);
      border: 1px solid rgba(15,23,42,0.08);
      padding: 10px 12px;
      box-shadow: 0 10px 24px rgba(15,23,42,0.08);
    }
    .suite-brand { font-weight: 800; color: #0f3d58; font-size: 1.1rem; }
    .suite-links { display: flex; gap: 8px; flex-wrap: wrap; }
    .suite-links a { color:#0f3d58; text-decoration:none; font-weight:700; background:#fff; border:1px solid rgba(15,23,42,0.12); border-radius:10px; padding:7px 10px; box-shadow:none; }
    .suite-links a.active { color:#fff; border-color:transparent; background:linear-gradient(135deg,#5aa7ff,#4b87ff); }
    header { display:flex; flex-wrap:wrap; gap:12px; align-items:center; justify-content:space-between; margin-bottom:20px; }
    .title { font-size:26px; font-weight:700; }
    a { color:#0f172a; text-decoration:none; font-weight:700; background: rgba(255,255,255,0.85); padding:8px 12px; border-radius:12px; box-shadow:0 8px 24px rgba(15,23,42,0.08); }
    .card {
      background: var(--panel);
      border: 1px solid rgba(15,23,42,0.06);
      border-radius: var(--radius);
      padding: 18px;
      box-shadow: var(--shadow);
      margin-bottom: 16px;
    }
    h2 { margin:0 0 12px; font-size:18px; }
    .subtext { color: var(--muted); margin: 0 0 10px; }
    .status { font-weight:700; margin-top: 6px; }
    .controls { display:flex; flex-wrap:wrap; gap:10px; margin-top:10px; }
    button {
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #0b1120;
      border: none;
      border-radius: 12px;
      padding: 10px 14px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 10px 30px rgba(79, 139, 255, 0.25);
    }
    input[type="file"] {
      width: 100%;
      background: rgba(255,255,255,0.9);
      border: 1px solid rgba(15,23,42,0.08);
      color: var(--text);
      border-radius: 10px;
      padding: 10px;
      font-size: 14px;
      font-family: inherit;
    }
    .story-box {
      background: rgba(255,255,255,0.9);
      border: 1px solid rgba(15,23,42,0.08);
      border-radius: 12px;
      padding: 12px;
      max-height: 340px;
      overflow: auto;
      line-height: 1.5;
      color: #0f172a;
      white-space: pre-wrap;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="suite-shell">
    <div class="suite-shell-inner">
      <div class="suite-brand">Care Fusion Suite</div>
      <nav class="suite-links">
        <a href="index.html">Story</a>
        <a href="http://localhost:5001/sign">Sign</a>
        <a href="http://localhost:8100/dashboard.html">Stutter</a>
        <a class="active" href="images.html">Images</a>
      </nav>
    </div>
  </div>

  <header>
    <div class="title">Story Images</div>
    <a href="index.html">← Back</a>
  </header>

  <div class="card">
    <h2>Upload an image</h2>
    <p class="subtext">We OCR the image, classify its emotion, and store it under <code>Story_Classfication/sorted_images/&lt;emotion&gt;/</code>.</p>
    <input type="file" id="uploadInput" accept=".png,.jpg,.jpeg,.bmp,.tif,.tiff" />
    <div class="controls">
      <button onclick="uploadImage()">Upload & classify</button>
    </div>
    <div id="uploadStatus" class="status"></div>
  </div>

  <div class="card">
    <h2>Result</h2>
    <div class="status" id="resultEmotion">Emotion: --</div>
    <div class="subtext" id="resultConfidence">Confidence: --</div>
    <div class="subtext" id="resultPath">Stored at: --</div>
    <div class="story-box" id="storyText">Extracted text will appear here.</div>
  </div>

  <script>
    const API_BASE = window.API_BASE || "http://localhost:5005";

    function setStatus(msg) {
      document.getElementById("uploadStatus").textContent = msg || "";
    }
    function updateResult(emotion, confidence, text, path) {
      document.getElementById("resultEmotion").textContent = `Emotion: ${emotion}`;
      const confMsg = confidence != null ? `${(confidence * 100).toFixed(1)}%` : "n/a";
      document.getElementById("resultConfidence").textContent = `Confidence: ${confMsg}`;
      document.getElementById("resultPath").textContent = `Stored at: ${path || "--"}`;
      document.getElementById("storyText").textContent = text || "No text extracted.";
    }

    async function uploadImage() {
      const input = document.getElementById('uploadInput');
      if (!input.files || input.files.length === 0) {
        setStatus("Choose an image first.");
        return;
      }
      const file = input.files[0];
      const form = new FormData();
      form.append("file", file);
      try {
        const resp = await fetch(`${API_BASE}/api/upload-image`, { method: "POST", body: form });
        if (!resp.ok) throw new Error(await resp.text());
        const data = await resp.json();
        updateResult(data.emotion, data.confidence, data.text, data.stored_at);
        setStatus(`Uploaded & classified: ${file.name}`);
      } catch (err) {
        console.error(err);
        setStatus("Upload failed. Is the backend running and Tesseract installed?");
      }
    }
  </script>
</body>
</html>
